[pytest]
# Pytest configuration for sniper-tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = unit integration performance system

# Minimum Python version
minversion = 7.0

# Command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end flows
    performance: Performance and latency tests
    system: System-level tests
    slow: Tests that take a long time to run
    quantum: Tests involving quantum computing
    
# Coverage options
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    
[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
