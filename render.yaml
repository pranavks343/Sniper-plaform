# Render Blueprint — Sniper Platform (Frontend + Backend)
# Repo root is the git root; all rootDir paths are relative to it.

services:
  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    runtime: node
    name: sniper-frontend
    rootDir: sniper-platform/apps/sniper
    # No standalone output — avoids Next.js 14.2.x route-group manifest bug (clientModules).
    # --include=dev for build-time deps when NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: HOSTNAME=0.0.0.0 npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    runtime: python
    name: sniper-backend
    rootDir: sniper-platform/apps/sniper-backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "https://sniper-frontend-ynz3.onrender.com,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sniper-db
          property: connectionString

databases:
  - name: sniper-db
    plan: free
