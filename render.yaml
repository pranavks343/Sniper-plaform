# Render Blueprint — Sniper Backend (FastAPI)
# Place this file at the REPO ROOT so Render picks it up automatically.
# rootDir is relative to the repo root.

services:
  - type: web
    runtime: python
    name: sniper-backend
    rootDir: sniper-platform/apps/sniper-backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "https://sniper-platform.onrender.com,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sniper-db
          property: connectionString
databases:
  - name: sniper-db
    plan: free
