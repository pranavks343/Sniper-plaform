# Render Blueprint — Sniper Platform (Frontend + Backend)
# Place this file at the REPO ROOT so Render picks it up automatically.

services:
  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  # No standalone output — avoids Next.js 14.2.x route-group clientModules bug.
  - type: web
    runtime: node
    name: sniper-frontend
    buildCommand: bun install && bun run --filter @sniper/app build
    startCommand: HOSTNAME=0.0.0.0 bun run --filter @sniper/app start
    healthCheckPath: /
    envVars:
      - key: BUN_INSTALL_CACHE_DIR
        value: /tmp/bun-cache
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    runtime: python
    name: sniper-backend
    rootDir: apps/sniper-backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sniper-db
          property: connectionString

databases:
  - name: sniper-db
    plan: free
