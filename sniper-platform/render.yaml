# Render Blueprint — Sniper Platform (Frontend + Backend)
# Place this file at the REPO ROOT so Render picks it up automatically.

services:
  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  # rootDir intentionally left unset (defaults to repo root) so that
  # `bun install` resolves the full monorepo workspace tree.  This ensures
  # hoisted node_modules are present for Next.js standalone file tracing,
  # which fixes the "clientModules undefined" runtime error.
  - type: web
    runtime: node
    name: sniper-frontend
    buildCommand: >
      bun install &&
      bun run build --workspace=apps/sniper &&
      cp -r apps/sniper/.next/static apps/sniper/.next/standalone/apps/sniper/.next/static &&
      cp -r apps/sniper/public apps/sniper/.next/standalone/apps/sniper/public
    startCommand: HOSTNAME=0.0.0.0 node apps/sniper/.next/standalone/apps/sniper/server.js
    healthCheckPath: /
    envVars:
      - key: BUN_INSTALL_CACHE_DIR
        value: /tmp/bun-cache
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    runtime: python
    name: sniper-backend
    rootDir: apps/sniper-backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sniper-db
          property: connectionString

databases:
  - name: sniper-db
    plan: free
