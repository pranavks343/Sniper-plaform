# Render Blueprint — Sniper backend (FastAPI)
# Use this when connecting the repo to Render so the backend builds from the correct directory.
# See DEPLOYMENT.md for full setup and env vars.

services:
  - type: web
    runtime: python
    name: sniper-backend
    rootDir: sniper-backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
