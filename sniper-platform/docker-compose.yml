version: '3.9'

services:
  frontend:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    volumes:
      - ./:/workspace
    depends_on:
      - backend

  backend:
    build:
      context: ./sniper-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
    env_file:
      - ./sniper-backend/.env.example
    volumes:
      - ./sniper-backend:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sniper
    ports:
      - '5432:5432'
    volumes:
      - sniper_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  sniper_postgres_data:
